<!-- Agentty: remote access (a globe behind a monitor), drawn to match the lucide icons beside it -->
<svg
  xmlns="http://www.w3.org/2000/svg"
  width="24"
  height="24"
  viewBox="0 0 24 24"
  fill="none"
  stroke="currentColor"
  stroke-width="1.75"
  stroke-linecap="round"
  stroke-linejoin="round"
>
  <defs>
    <!-- The globe stops short of the monitor, as if behind it. -->
    <clipPath id="behind-monitor">
      <path clip-rule="evenodd" d="M0 0H24V24H0Z M9.25 9.25H24V24H9.25Z" />
    </clipPath>
  </defs>
  <g clip-path="url(#behind-monitor)">
    <circle cx="9" cy="9" r="7" />
    <path d="M9 2a10 10 0 0 0 0 14a10 10 0 0 0 0-14" />
    <path d="M2 9h14" />
  </g>
  <rect x="11" y="11" width="11" height="8" rx="1.5" />
  <path d="M16.5 19v2.5" />
  <path d="M14 21.5h5" />
</svg>
