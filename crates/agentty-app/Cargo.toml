[package]
name = "agentty-app"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
description = "Agentty — your multi-orchestration AI terminal"

[[bin]]
name = "agentty"
path = "src/main.rs"

[dependencies]
# SVG a plugin wrote, turned into PNG (`media/svgToPng`); already in the tree through gpui.
resvg = "0.45"
alacritty_terminal = "0.26"
anyhow.workspace = true
base64 = "0.23"
chrono = { version = "0.4.45", default-features = false, features = ["clock", "std"] }
agentty-bridge = { path = "../agentty-bridge" }
agentty-db = { path = "../agentty-db" }
dirs.workspace = true
futures = "0.3.34"
gpui = { version = "0.2.2", default-features = false, features = ["font-kit", "runtime_shaders"] }
libc = "0.2.189"
plist = "1.10.1"
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
# The markdown preview's Content-Security-Policy lists its scripts by hash.
sha2 = "0.11"
# Syntax highlighting for the file editor: Sublime Text grammars (bat's curated set) on the pure-Rust regex engine.
syntect = { version = "5.3.0", default-features = false, features = ["parsing", "regex-fancy"] }
two-face = { version = "0.5.2", default-features = false, features = ["syntect-fancy"] }
toml = "1.1"
unicode-segmentation = "1.13.3"
uuid = { version = "1.26.1", features = ["v4"] }
# WebAssembly plugins. An interpreter, not a JIT: nothing makes executable pages at runtime, so
# Agentty keeps its hardened runtime without a JIT exception. `validate` is what refuses a
# malformed module before it runs; the text format (`wat`) is deliberately left out.
wasmi = { version = "2.0.0", default-features = false, features = ["std", "stable", "validate", "auto-dispatch"] }

# Linux needs GPUI's X11 and Wayland backends (off with default features); Windows its app manifest.
[target.'cfg(target_os = "linux")'.dependencies]
gpui = { version = "0.2.2", default-features = false, features = ["font-kit", "runtime_shaders", "wayland", "x11"] }

[target.'cfg(windows)'.dependencies]
gpui = { version = "0.2.2", default-features = false, features = ["font-kit", "runtime_shaders", "windows-manifest"] }
windows-sys = { version = "0.61", features = ["Wdk_System_Threading", "Win32_Foundation", "Win32_Globalization", "Win32_System_Console", "Win32_System_Diagnostics_Debug", "Win32_System_Diagnostics_ToolHelp", "Win32_System_Kernel", "Win32_System_Power", "Win32_System_Threading"] }

[target.'cfg(windows)'.build-dependencies]
embed-resource = "3"

[target.'cfg(target_os = "macos")'.dependencies]
block = "0.1.6"
cocoa = "0.27"
core-graphics = "0.25"
objc = "0.2.7"
raw-window-handle = "0.6"
core-foundation = "0.10"
png = "0.18"
