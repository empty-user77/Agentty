[package]
name = "agentty-bridge"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
description = "Local Claude Code / Codex session discovery, usage accounting and context handoff for Agentty"

[dependencies]
anyhow.workspace = true
chrono = { version = "0.4.45", default-features = false, features = ["clock", "std", "serde"] }
clap = { version = "4.6.7", features = ["derive"] }
dirs.workspace = true
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
toml = "1.1"
ureq = { version = "2", default-features = false, features = ["tls", "json"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
rustls-platform-verifier = "0.7"
webpki-roots = "1.0"
sha2 = "0.11"
ring = "0.17"
base64 = "0.22"
url = "2.5.8"
memchr = "2"
whisper-rs = { version = "0.16", optional = true }
hound = { version = "3.5", optional = true }

[features]
# On-device voice-to-text. Compiles whisper.cpp (needs cmake + a C/C++ toolchain); on by default
# so release builds have it. agentty-app and agentty-db take this crate with default features off
# (the app forwards its own `voice` feature here), so `cargo build -p agentty-app
# --no-default-features` skips it. Any new default feature added here must also be listed for
# agentty-app in its Cargo.toml.
default = ["voice"]
voice = ["dep:whisper-rs", "dep:hound"]

[target.'cfg(unix)'.dependencies]
libc = "0.2.189"

[target.'cfg(target_os = "macos")'.dependencies]
security-framework = "3"
# Transcription on the GPU: Large-v3 Turbo answers a prompt in about a second with Metal, several
# times slower on the CPU alone. Still only built with the `voice` feature (the dependency stays
# optional); the Metal shaders are embedded in the binary.
whisper-rs = { version = "0.16", optional = true, features = ["metal"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Security_Credentials", "Win32_Storage_FileSystem", "Win32_System_IO", "Win32_System_Registry"] }
