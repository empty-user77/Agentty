[package]
name = "hello-rust"
version = "0.1.0"
edition = "2021"
license = "GPL-3.0-or-later"
description = "The smallest Agentty plugin written in Rust"

# Built for wasm32-unknown-unknown, not with Agentty.
[workspace]

[lib]
crate-type = ["cdylib"]

[dependencies]
agentty-plugin = { path = "../../sdk/rust" }
serde_json = "1"

[profile.release]
# A plugin is downloaded and read by whoever installs it: keep the module small.
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true
