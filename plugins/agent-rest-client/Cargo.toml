[package]
name = "agent-rest-client"
version = "0.1.0"
edition = "2021"
license = "GPL-3.0-or-later"
description = "Postman-style REST client for Agentty, written in Rust and run as WebAssembly"

# Built for wasm32-unknown-unknown, not with Agentty.
[workspace]

[lib]
crate-type = ["cdylib"]

[dependencies]
agentty-plugin = { path = "../../sdk/rust" }
serde_json = "1"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true
