name: Release packages

# Builds the Windows installer and the Linux packages for a release. Runs when a vX.Y.Z tag is pushed (the release
# skill pushes it) and by hand for any ref. Nothing is published from here and the workflow holds no token for
# the release: the release skill downloads the artifacts (scripts/fetch-release-packages.sh) and uploads them
# with the DMG from the maintainer's Mac. The only secrets are the analytics ids compiled into every copy of the app
# (as in the DMG), and a pull request's build goes without them.
on:
  push:
    tags: ['v*']
  # Pull requests that change the packaging build it too, so a broken installer shows up before the release. Only
  # these paths: the packages take a while to build.
  pull_request:
    paths:
      - .github/workflows/release-packages.yml
      - packaging/**
      - scripts/package-windows.ps1
      - scripts/build-linux-packages.sh
  workflow_dispatch:
    inputs:
      ref:
        description: Branch, tag or commit to build
        required: true
        default: main

permissions:
  contents: read

concurrency:
  group: release-packages-${{ inputs.ref || github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

jobs:
  # GitHub's hosted runners, like CI: a fresh machine per job, so a pull request from anybody can run here. GitHub gives
  # a fork's pull request no secrets at all.
  windows:
    runs-on: windows-2025
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref || github.ref }}
      - name: Version matches the tag
        if: github.ref_type == 'tag'
        env:
          TAG: ${{ github.ref_name }}
        run: |
          $version = (Select-String -Path Cargo.toml -Pattern '^version = "(.*)"' | Select-Object -First 1).Matches[0].Groups[1].Value
          if ("v$version" -ne $env:TAG) { throw "Cargo.toml has $version, the tag is $env:TAG" }
      - name: Install toolchain
        run: rustup toolchain install
      # The installer is built with Inno Setup 6; installed here only when the image does not have it, from the
      # project's own GitHub release and checked against a pinned SHA-256, since what it builds ships to users.
      - name: Inno Setup
        env:
          INNO_URL: https://github.com/jrsoftware/issrc/releases/download/is-6_7_3/innosetup-6.7.3.exe
          INNO_SHA256: 9c73c3bae7ed48d44112a0f48e66742c00090bdb5bef71d9d3c056c66e97b732
        run: |
          $found = (Get-Command ISCC.exe -ErrorAction SilentlyContinue) -or (Test-Path "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe")
          if (-not $found) {
            $setup = Join-Path $env:RUNNER_TEMP 'innosetup.exe'
            Invoke-WebRequest -Uri $env:INNO_URL -OutFile $setup
            $hash = (Get-FileHash -Algorithm SHA256 $setup).Hash.ToLower()
            if ($hash -ne $env:INNO_SHA256) { throw "Inno Setup download does not match its checksum ($hash)" }
            Start-Process -FilePath $setup -ArgumentList '/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART', '/SP-' -Wait
          }
      - name: Build installer and zips
        env:
          AGENTTY_GA_MEASUREMENT_ID: ${{ github.event_name != 'pull_request' && secrets.AGENTTY_GA_MEASUREMENT_ID || '' }}
          AGENTTY_GA_API_SECRET: ${{ github.event_name != 'pull_request' && secrets.AGENTTY_GA_API_SECRET || '' }}
        run: |
          ./scripts/package-windows.ps1 -Installer
          $info = (Get-Item "target\release\agentty.exe").VersionInfo
          if ($info.ProductName -ne 'Agentty') { throw "version resource missing: '$($info.ProductName)'" }
          Get-ChildItem dist | Where-Object { $_.Name -like '*-windows-*' } | ForEach-Object {
            "{0}  {1}" -f (Get-FileHash -Algorithm SHA256 $_.FullName).Hash.ToLower(), $_.Name
          }
      # What goes to users has analytics in it, like the DMG (build-dmg.sh refuses otherwise). Names only in the errors.
      - name: Analytics are compiled in
        if: github.event_name != 'pull_request'
        env:
          AGENTTY_GA_MEASUREMENT_ID: ${{ github.event_name != 'pull_request' && secrets.AGENTTY_GA_MEASUREMENT_ID || '' }}
          AGENTTY_GA_API_SECRET: ${{ github.event_name != 'pull_request' && secrets.AGENTTY_GA_API_SECRET || '' }}
        run: |
          $binary = [Text.Encoding]::Latin1.GetString([IO.File]::ReadAllBytes("target\release\agentty.exe"))
          foreach ($name in 'AGENTTY_GA_MEASUREMENT_ID', 'AGENTTY_GA_API_SECRET') {
            $value = [Environment]::GetEnvironmentVariable($name)
            if (-not $value) { throw "$name is not set in the repository's secrets" }
            if (-not $binary.Contains($value)) { throw "$name is not in the binary" }
          }
      # The installer really installed, twice: the second run goes over the first, as an update does. Without
      # agentty.com a bare `agentty` still works but stops waiting, which no other check would notice.
      - name: The installer installs what a terminal runs
        run: |
          $version = (Select-String -Path Cargo.toml -Pattern '^version = "(.*)"' | Select-Object -First 1).Matches[0].Groups[1].Value
          $setup = (Resolve-Path "dist\Agentty-$version-windows-x64-setup.exe").Path
          $dir = Join-Path $env:RUNNER_TEMP 'agentty-install'
          foreach ($round in 1, 2) {
            $run = Start-Process -FilePath $setup -ArgumentList '/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART', '/SP-', "/DIR=$dir" -Wait -PassThru
            if ($run.ExitCode -ne 0) { throw "install $round exited with $($run.ExitCode)" }
            foreach ($file in 'agentty.exe', 'agentty.com') {
              if (-not (Test-Path -LiteralPath (Join-Path $dir $file))) { throw "install $round left no $file" }
            }
            if (Get-ChildItem -Path $dir -Filter '*.old-*') { throw "install $round left a previous version behind" }
          }
          $env:Path = "$dir;$env:Path"
          $found = (Get-Command agentty | Select-Object -First 1).Source
          if ($found -ne (Join-Path $dir 'agentty.com')) { throw "a bare agentty runs $found" }
          $out = agentty --version
          if ($LASTEXITCODE -ne 0) { throw "agentty --version exited with $LASTEXITCODE" }
          if ("$out" -notlike "*$version*") { throw "agentty --version printed '$out', expected $version" }
          # Outside an Agentty terminal this command fails: its exit code has to come through.
          Remove-Item Env:AGENTTY_SOCKET -ErrorAction SilentlyContinue
          agentty browser title 2>$null
          if ($LASTEXITCODE -eq 0) { throw 'a failed command exited with 0' }
          exit 0
      # A pull request only checks that the packages build; a tag or a run by hand keeps them for
      # scripts/fetch-release-packages.sh.
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: github.event_name != 'pull_request'
        with:
          name: agentty-windows-x64
          path: |
            dist/Agentty-*-windows-x64-setup.exe
            dist/Agentty-*-windows-x64-setup.zip
            dist/agentty-*-windows-x86_64.zip
          if-no-files-found: error
          retention-days: 7

  # Builds in an AlmaLinux 9 x86_64 container on the hosted Ubuntu runner (native x86_64, no emulation) and installs
  # each package in a clean container.
  linux:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref || github.ref }}
      - name: Version matches the tag
        if: github.ref_type == 'tag'
        env:
          TAG: ${{ github.ref_name }}
        run: |
          version=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -n 1)
          [[ "v$version" == "$TAG" ]] || { echo "::error::Cargo.toml has $version, the tag is $TAG"; exit 1; }
      - name: Build .deb and .rpm, install each in a clean container
        env:
          AGENTTY_GA_MEASUREMENT_ID: ${{ github.event_name != 'pull_request' && secrets.AGENTTY_GA_MEASUREMENT_ID || '' }}
          AGENTTY_GA_API_SECRET: ${{ github.event_name != 'pull_request' && secrets.AGENTTY_GA_API_SECRET || '' }}
        run: scripts/build-linux-packages.sh --check
      - name: Analytics are compiled in
        if: github.event_name != 'pull_request'
        env:
          AGENTTY_GA_MEASUREMENT_ID: ${{ github.event_name != 'pull_request' && secrets.AGENTTY_GA_MEASUREMENT_ID || '' }}
          AGENTTY_GA_API_SECRET: ${{ github.event_name != 'pull_request' && secrets.AGENTTY_GA_API_SECRET || '' }}
        run: |
          unpacked=$(mktemp -d)
          dpkg-deb -x dist/Agentty-*-linux-amd64.deb "$unpacked"
          for name in AGENTTY_GA_MEASUREMENT_ID AGENTTY_GA_API_SECRET; do
            [[ -n "${!name}" ]] || { echo "::error::$name is not set in the repository's secrets"; exit 1; }
            LC_ALL=C grep -r -a -q -F -- "${!name}" "$unpacked" || { echo "::error::$name is not in the binary"; exit 1; }
          done
      # A pull request only checks that the packages build and install; a tag or a run by hand keeps them for
      # scripts/fetch-release-packages.sh.
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: github.event_name != 'pull_request'
        with:
          name: agentty-linux-x86_64
          path: |
            dist/Agentty-*-linux-amd64.deb
            dist/Agentty-*-linux-x86_64.rpm
          if-no-files-found: error
          retention-days: 7
