name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Scan tracked files for credentials
        run: python3 scripts/check-secrets.py --all
      - name: Scan commits in this push / pull request
        if: github.event_name == 'pull_request' || github.event.before != '0000000000000000000000000000000000000000'
        run: |
          base="${{ github.event.pull_request.base.sha || github.event.before }}"
          python3 scripts/check-secrets.py --range "$base..${{ github.sha }}"

  check:
    needs: secrets
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      # The toolchain (and its rustfmt / clippy) comes from rust-toolchain.toml, same as locally.
      - name: Install toolchain
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - name: Format
        run: cargo fmt --all -- --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Test
        run: cargo test --workspace
      - name: Build (release)
        run: cargo build --release -p agentty-app
