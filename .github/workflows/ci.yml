name: CI

# Every pull request, and every push to main: merged pull requests are combined there, and only a
# run on main shows that the combination still builds and passes on all three platforms.
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  # Everything runs on GitHub's hosted runners: a fresh machine per job, thrown away afterwards, so a
  # pull request from anybody can run here without reaching anyone's own computer. No job holds a
  # secret. The toolchain (and its rustfmt / clippy) comes from rust-toolchain.toml, same as locally.
  secrets:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - name: Scan tracked files for credentials
        run: python3 scripts/check-secrets.py --all
      - name: Security audit (forbidden files, personal data, weakened guarantees, guard wiring)
        run: python3 scripts/security-audit.py --all
      - name: Scan commits in this push / pull request
        if: github.event_name == 'pull_request' || github.event.before != '0000000000000000000000000000000000000000'
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD: ${{ github.sha }}
        run: python3 scripts/check-secrets.py --range "$BASE..$HEAD"

  check:
    needs: secrets
    runs-on: macos-15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Install toolchain
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - name: Format
        run: cargo fmt --all -- --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Test
        run: cargo test --workspace
      - name: Build (release)
        run: cargo build --release -p agentty-app

  # Windows can't be built on a Mac (GPUI compiles its shaders with the Windows SDK's fxc.exe), which
  # the hosted Windows image has. The zip is uploaded as a workflow artifact: download it from the
  # run's Summary page.
  check-windows:
    needs: secrets
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Install toolchain
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Test
        run: cargo test --workspace
      - name: Package
        run: |
          ./scripts/package-windows.ps1
          $info = (Get-Item "target\release\agentty.exe").VersionInfo
          if ($info.ProductName -ne 'Agentty') { throw "version resource missing: '$($info.ProductName)'" }
      # Packages from main only, for a day. A failed upload must not turn a green build red: the
      # checks above are what CI is for, and the package is a convenience.
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: github.event_name == 'push'
        continue-on-error: true
        with:
          name: agentty-windows-x86_64
          path: |
            dist/agentty-*-windows-*.zip
            dist/agentty-*-windows-*.zip.sha256
          if-no-files-found: error
          retention-days: 1

  check-linux:
    needs: secrets
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: System libraries
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends build-essential pkg-config \
            libxkbcommon-dev libxkbcommon-x11-dev libwayland-dev libx11-xcb-dev libxcb1-dev \
            libvulkan-dev libfontconfig-dev libfreetype-dev libzstd-dev zsh >/dev/null
      - name: Install toolchain
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Test
        run: cargo test --workspace
      - name: Package
        run: scripts/package-linux.sh
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: github.event_name == 'push'
        continue-on-error: true
        with:
          name: agentty-linux-x86_64
          path: |
            dist/agentty-*-linux-*.tar.gz
            dist/agentty-*-linux-*.tar.gz.sha256
          if-no-files-found: error
          retention-days: 1
