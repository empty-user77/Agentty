# Weekly update pull requests for the Rust crates and the pinned GitHub Actions, grouped so a week's
# updates arrive as one pull request per ecosystem instead of one per crate.
version: 2
updates:
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      cargo:
        patterns: ['*']
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ['*']
