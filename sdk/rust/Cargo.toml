[package]
name = "agentty-plugin"
version = "0.1.0"
edition = "2021"
license = "GPL-3.0-or-later"
description = "Write Agentty plugins in Rust, compiled to WebAssembly"
repository = "https://github.com/empty-user77/Agentty"

# Its own workspace: this crate is built for wasm32-unknown-unknown, not with Agentty.
[workspace]

[lib]
crate-type = ["rlib"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
